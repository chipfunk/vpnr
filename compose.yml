services:
    vpnr_1:
        image: chipfunk/vpnr:latest
        command:
            - start
        environment:
            - VPNR_VPN_IP_ADDR=10.0.1.1
            - VPNR_VPN_INTERFACE_NAME=vpnr1
            - VPNR_PRIVATE_KEYFILE_PATH=/run/secrets/vpnr_1
            - VPNR_LISTEN_ADDR=0.0.0.0
            - VPNR_LISTEN_PORT=1111
            - RUST_LOG=TRACE
        secrets:
            - vpnr_1
        volumes:
            - vpnr_1:/data
        networks:
            - node-discovery
        privileged: true
        devices:
            - /dev/net/tun:/dev/net/tun:rw
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - KILL
            - NET_BIND_SERVICE
            - SETFCAP
            - SETGID
            - SETPCAP
            - SETUID
            - SYS_CHROOT
            - NET_ADMIN
            - NET_RAW

    vpnr_2:
        image: chipfunk/vpnr:latest
        command:
            - start
        environment:
            - VPNR_VPN_IP_ADDR=10.0.1.2
            - VPNR_VPN_INTERFACE_NAME=vpnr2
            - VPNR_PRIVATE_KEYFILE_PATH=/run/secrets/vpnr_2
            - VPNR_LISTEN_ADDR=0.0.0.0
            - VPNR_LISTEN_PORT=2222
            - RUST_LOG=TRACE
        secrets:
            - vpnr_2
        volumes:
            - vpnr_2:/data
        networks:
            - node-discovery
        privileged: true
        devices:
            - /dev/net/tun:/dev/net/tun:rw
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - KILL
            - NET_BIND_SERVICE
            - SETFCAP
            - SETGID
            - SETPCAP
            - SETUID
            - SYS_CHROOT
            - NET_ADMIN
            - NET_RAW

secrets:
    vpnr_1:
        file: ./private-key-1.ed25519
    vpnr_2:
        file: ./private-key-2.ed25519

volumes:
    vpnr_1: {}
    vpnr_2: {}

networks:
    node-discovery:
        driver: bridge
        internal: true
        enable_ipv4: true
        enable_ipv6: false
        ipam:
            driver: default
            config:
                - subnet: 172.28.0.0/16
