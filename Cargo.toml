[package]
name = "vpnr"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
libp2p = { version = ">=0.56.0", features = [
    "dns",
    "kad",
    "gossipsub",
    "macros",
    "mdns",
    "noise",
    "identify",
    "ping",
    "relay",
    "pnet",
    "quic",
    "relay",
    "rendezvous",
    "rsa",
    "tcp",
    "tokio",
    "upnp",
    "yamux",
    "memory-connection-limits",
    "dcutr",
    "autonat",
    "serde",
] }
either = ">=1.15"
serde = { version = ">=1.0", features = ["derive"] }
serde_json = ">=1.0"
serde_yaml = ">=0.9"
futures = { version = ">=0.3" }
tokio = { version = ">=1.46", features = ["full"] }
pnet = ">=0.35"
rand = ">=0.9"
tracing = ">=0.1"
tracing-subscriber = ">=0.3"
confy = ">= 2.0"
tun-rs = { version = "2.8.9", features = ["tokio"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = 'abort'
strip = true
